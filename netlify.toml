[build]
	base = "."
	command = "npm run build"
	publish = "dist"

[build.environment]
	NODE_VERSION = "22"

[[headers]]
	for = "/ads.txt"
	[headers.values]
		Content-Type = "text/plain; charset=utf-8"
		X-Content-Type-Options = "nosniff"

[[headers]]
	for = "/robots.txt"
	[headers.values]
		Content-Type = "text/plain; charset=utf-8"

[[headers]]
	for = "/humans.txt"
	[headers.values]
		Content-Type = "text/plain; charset=utf-8"

[[headers]]
	for = "/*.webmanifest"
	[headers.values]
		Content-Type = "application/manifest+json"

[[headers]]
	for = "/*"
	[headers.values]
		Referrer-Policy = "strict-origin-when-cross-origin"
		X-Frame-Options = "DENY"
